<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前後測 DEMO</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ff;color:#241d3d;font-family:"Microsoft JhengHei",sans-serif}.wrap{width:min(720px,calc(100% - 28px));margin:28px auto;padding:28px;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(50,38,90,.14)}.mark{display:inline-grid;width:48px;height:48px;place-items:center;border-radius:15px;background:#ffd65a;font-weight:900}h1{margin:18px 0 6px}p{color:#6c6580;line-height:1.7}.q{margin:22px 0;padding:18px;border:1px solid #ddd8ed;border-radius:16px}.q strong{display:block;margin-bottom:12px}.q label{display:block;margin:9px 0}button{width:100%;min-height:50px;border:0;border-radius:14px;background:#553a8a;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.result{padding:20px;border-radius:16px;background:#eaf7f3;color:#176b5c;text-align:center;font-weight:900}</style></head><body><main class="wrap"><span class="mark">YL</span><h1 id="title">教育前後測 DEMO</h1><p>本表單只模擬作答流程，不會送出或保存真實資料。</p><form id="quiz"><section class="q"><strong>1. 一般日常接觸是否會傳染 HIV？</strong><label><input type="radio" name="q1" value="no" required> 不會</label><label><input type="radio" name="q1" value="yes"> 會</label></section><section class="q"><strong>2. PEP 應在可能暴露後多久內儘速評估？</strong><label><input type="radio" name="q2" value="72" required> 72 小時內</label><label><input type="radio" name="q2" value="week"> 一週後</label></section><button type="submit">送出展示答案</button></form><div id="result" class="result" hidden>作答完成｜展示分數：100 分<br>此結果只存在目前畫面。</div></main><script>const type=new URLSearchParams(location.search).get('type')||'教育測驗';document.getElementById('title').textContent=type+'｜DEMO';document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.hidden=true;document.getElementById('result').hidden=false})</script></body></html>
